<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Train View</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  #cesiumContainer { width:100%; height:100%; }

  /* Hide ALL Cesium UI chrome */
  .cesium-widget-credits,
  .cesium-infoBox,
  .cesium-selection-wrapper,
  .cesium-viewer-toolbar,
  .cesium-viewer-animationContainer,
  .cesium-viewer-timelineContainer,
  .cesium-viewer-bottom,
  .cesium-navigationHelpButton-wrapper,
  .cesium-viewer-geocoderContainer { display:none !important; }

  /* Loading overlay */
  #loading {
    position:fixed; inset:0; background:#000a18;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:rgba(120,200,255,0.8); font-family:system-ui; font-size:13px; gap:12px;
    transition: opacity 1s ease;
  }
  #loading.hidden { opacity:0; pointer-events:none; }
  .load-dot {
    width:8px; height:8px; border-radius:50%; background:rgba(120,200,255,0.6);
    display:inline-block; margin:0 3px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .load-dot:nth-child(2){ animation-delay:.2s; }
  .load-dot:nth-child(3){ animation-delay:.4s; }
  @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8);} 50%{opacity:1;transform:scale(1.2);} }
</style>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
<link  href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
</head>
<body>
<div id="loading">
  <div style="font-size:16px;letter-spacing:.05em;margin-bottom:4px">🌏 Loading Singapore</div>
  <div><span class="load-dot"></span><span class="load-dot"></span><span class="load-dot"></span></div>
  <div style="opacity:.5;font-size:11px">Photorealistic 3D tiles</div>
</div>
<div id="cesiumContainer"></div>

<script>
// ── Tokens ───────────────────────────────────────────────────────────────────
Cesium.Ion.defaultAccessToken =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5NjgyMGZmMC01NTdlLTQxZjQtODIyMy00YWZlZGY1ZWU2ODgiLCJpZCI6NDQ2NDg3LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODE4NTAyMDF9.F9eYt0I4a44zm1zFRYyzJFfnLsytQJ8hP6He5yi8zAc';

// Google key injected by server — empty string = no 3D tiles, falls back to Bing+terrain
const GOOGLE_KEY = '%%GOOGLE_MAPS_KEY%%';
if (GOOGLE_KEY) Cesium.GoogleMaps.defaultApiKey = GOOGLE_KEY;

// ── Viewer ────────────────────────────────────────────────────────────────────
// globe:true always — 3D tiles layer on top; if tiles fail, globe imagery shows
const viewer = new Cesium.Viewer('cesiumContainer', {
  timeline:             false,
  animation:            false,
  sceneModePicker:      false,
  baseLayerPicker:      false,
  navigationHelpButton: false,
  homeButton:           false,
  geocoder:             false,
  fullscreenButton:     false,
  infoBox:              false,
  selectionIndicator:   false,
  // Keep globe visible as fallback if 3D tiles fail
  terrainProvider:      new Cesium.EllipsoidTerrainProvider(),
});

viewer.scene.skyAtmosphere.show = true;
viewer.scene.fog.enabled        = true;
viewer.scene.fog.density        = 0.0001;
viewer.scene.globe.enableLighting = true;

// ── Try Google Photorealistic 3D Tiles ────────────────────────────────────────
const loadingEl = document.getElementById('loading');

(async () => {
  let tilesLoaded = false;

  if (GOOGLE_KEY) {
    try {
      const tileset = await Cesium.createGooglePhotorealistic3DTileset();
      viewer.scene.primitives.add(tileset);
      // Hide the globe — 3D tiles include ground
      viewer.scene.globe.show = false;
      tilesLoaded = true;
      console.log('[CesiumTrain] Google 3D Tiles loaded ✓');
    } catch (e) {
      console.warn('[CesiumTrain] Google 3D Tiles failed:', e.message, '— using globe fallback');
    }
  } else {
    console.info('[CesiumTrain] No Google key — using Bing imagery + terrain');
  }

  // If 3D tiles failed / no key: load Cesium World Terrain for nice fallback
  if (!tilesLoaded) {
    try {
      const terrain = await Cesium.createWorldTerrainAsync({ requestWaterMask: true });
      viewer.scene.terrainProvider = terrain;
    } catch (e) {
      // EllipsoidTerrainProvider already set above — safe default
    }
  }

  // ── Smooth continuous flythrough — parametric path, no flyTo jumps ────────
  //
  // The camera follows a slow elliptical orbit around Singapore's core,
  // updated every frame via preRender. Speed is very gentle (~1 full loop
  // every ~3 minutes). Altitude and heading vary smoothly with sine waves
  // so it feels like a graceful aerial sightseeing cruise, not a slideshow.
  //
  // Centre of orbit: Marina Bay / CBD area (lon 103.852, lat 1.283)
  // Orbit radius: ~0.07° lon × ~0.04° lat  (~8 km east-west)

  // Sync Cesium sun to real Singapore time
  viewer.clock.currentTime = Cesium.JulianDate.fromDate(new Date());
  viewer.clock.multiplier  = 1;

  // Parametric time — advances each frame
  let pathT = 0;

  // Speed: full loop in ~180 seconds (very leisurely cruise)
  const LOOP_SECONDS  = 180;
  const SPEED_RAD_PER_S = (Math.PI * 2) / LOOP_SECONDS;

  // Central anchor (Marina Bay area)
  const CX = 103.852, CY = 1.283;

  let lastWallTime = null;
  let animating    = true;

  viewer.scene.preRender.addEventListener((_scene, time) => {
    if (!animating) return;

    // Wall-clock delta (caps at 100ms to survive tab switching)
    const wallMs  = performance.now();
    const deltaS  = lastWallTime ? Math.min((wallMs - lastWallTime) / 1000, 0.1) : 0.016;
    lastWallTime  = wallMs;

    pathT += deltaS * SPEED_RAD_PER_S;

    // Elliptical orbit in lon/lat space
    const lon = CX + 0.072 * Math.cos(pathT);
    const lat = CY + 0.038 * Math.sin(pathT);

    // Altitude: 350–750 m, varies with a separate slower wave
    const alt = 550 + 200 * Math.sin(pathT * 1.3 + 0.8);

    // Heading: always looking roughly inward toward centre + slow drift
    // atan2 gives angle from camera toward centre, converted to Cesium heading
    const dLon = CX - lon;
    const dLat = CY - lat;
    const headingRad = Math.atan2(dLon, dLat) + Math.PI + 0.25 * Math.sin(pathT * 0.7);

    // Pitch: gently varying between -12° and -28° (looking down at city)
    const pitchDeg = -18 + 8 * Math.sin(pathT * 0.9 + 1.2);

    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(lon, lat, alt),
      orientation: {
        heading: headingRad,
        pitch:   Cesium.Math.toRadians(pitchDeg),
        roll:    0,
      },
    });
  });

  // Hide loading overlay
  setTimeout(() => {
    loadingEl.classList.add('hidden');
    setTimeout(() => { loadingEl.style.display = 'none'; }, 1000);
    lastWallTime = performance.now();
  }, tilesLoaded ? 1500 : 600);

  // Parent page messaging
  window.addEventListener('message', ({ data }) => {
    if (!data?.type) return;
    if (data.type === 'cesium-pause')  { animating = false; }
    if (data.type === 'cesium-resume') { animating = true; lastWallTime = performance.now(); }
  });

})();
</script>
</body>
</html>
